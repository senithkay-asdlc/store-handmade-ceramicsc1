apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: ceramics-api

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  resources:
    - ref: store-handmade-ce-9ffc9e02
      envBindings:
        dbname: CERAMICS_DB_DBNAME
        host: CERAMICS_DB_HOST
        password: CERAMICS_DB_PASSWORD
        port: CERAMICS_DB_PORT
        user: CERAMICS_DB_USER
    - ref: store-handmade-ce-eb4ed680
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        scopes: USER_AUTH_SCOPES
    - ref: store-handmade-ce-17b66400
      envBindings:
        STRIPE_API_KEY: STRIPE_API_KEY
        STRIPE_WEBHOOK_SECRET: STRIPE_WEBHOOK_SECRET
