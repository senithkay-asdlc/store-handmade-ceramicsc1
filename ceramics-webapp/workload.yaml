apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: ceramics-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: store-handmade-ceramicsc1-ceramics-api
      name: http
      visibility: project
      envBindings:
        address: CERAMICS_API_URL
  resources:
    - ref: store-handmade-ce-eb4ed680
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        scopes: USER_AUTH_SCOPES
